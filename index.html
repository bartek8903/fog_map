<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fog Game</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
}

#map{
width:100vw;
height:100vh;
}

#hud{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
background:rgba(0,0,0,0.7);
padding:12px 20px;
border-radius:15px;
color:white;
z-index:9999;
}

#percent{
font-size:28px;
font-weight:bold;
}

#coins{
color:gold;
font-weight:bold;
}

#coin{
position:absolute;
left:50%;
bottom:120px;
transform:translateX(-50%);
font-size:50px;
opacity:0;
}

.coinShow{
animation:coin 1s ease;
}

@keyframes coin{
0%{transform:translate(-50%,0) scale(0.3);opacity:0;}
30%{opacity:1;}
100%{transform:translate(-50%,-120px) scale(1);opacity:0;}
}

#fogCanvas{
position:absolute;
inset:0;
pointer-events:none;
z-index:500;
}
</style>
</head>

<body>

<div id="map"></div>
<canvas id="fogCanvas"></canvas>

<div id="hud">
<div id="percent">0%</div>
<div id="coins">0 🪙</div>
</div>

<div id="coin">🪙</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([54.35,18.64],15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OSM'
}).addTo(map);

const canvas = document.getElementById("fogCanvas");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = innerWidth;
canvas.height = innerHeight;
drawFog();
}
window.addEventListener("resize",resize);
resize();

function drawFog(){
ctx.fillStyle="rgba(0,0,0,0.95)";
ctx.fillRect(0,0,canvas.width,canvas.height);
}

const discovered = new Set();
let coins = 0;

function reveal(lat,lng,x,y){

const key = `${Math.floor(lat*1000)}_${Math.floor(lng*1000)}`;

let isNew = false;

if(!discovered.has(key)){
discovered.add(key);
isNew = true;
}

ctx.save();
ctx.globalCompositeOperation="destination-out";

const g = ctx.createRadialGradient(x,y,20,x,y,120);
g.addColorStop(0,"rgba(0,0,0,1)");
g.addColorStop(1,"rgba(0,0,0,0)");

ctx.fillStyle=g;
ctx.beginPath();
ctx.arc(x,y,120,0,Math.PI*2);
ctx.fill();
ctx.restore();

if(isNew){
coins++;

document.getElementById("coins").innerText = coins + " 🪙";

const coin = document.getElementById("coin");
coin.classList.remove("coinShow");
void coin.offsetWidth;
coin.classList.add("coinShow");
}
}

let player;

const icon = L.divIcon({
className:"",
html:`<div style="width:20px;height:20px;background:red;border-radius:50%;border:3px solid white;"></div>`
});

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

map.setView([lat,lng]);

if(!player){
player = L.marker([lat,lng],{icon}).addTo(map);
}else{
player.setLatLng([lat,lng]);
}

const point = map.latLngToContainerPoint([lat,lng]);

reveal(lat,lng,point.x,point.y);

document.getElementById("percent").innerText =
(Math.min(100,discovered.size/2000*100)).toFixed(1)+"%";

});

drawFog();

</script>

</body>
</html>
