<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fog Map PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
}

#map{
width:100vw;
height:100vh;
}

#hud{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
background:rgba(0,0,0,0.7);
padding:12px 18px;
border-radius:14px;
color:white;
z-index:9999;
}

#percent{
font-size:26px;
font-weight:bold;
}

#coins{
color:gold;
font-weight:bold;
}

#fog{
position:absolute;
inset:0;
pointer-events:none;
z-index:500;
}

#coin{
position:absolute;
left:50%;
bottom:120px;
transform:translateX(-50%);
font-size:50px;
opacity:0;
}

.coinShow{
animation:coin 1s ease;
}

@keyframes coin{
0%{transform:translate(-50%,0) scale(0.3);opacity:0;}
30%{opacity:1;}
100%{transform:translate(-50%,-120px) scale(1);opacity:0;}
}
</style>
</head>

<body>

<div id="map"></div>
<canvas id="fog"></canvas>

<div id="hud">
<div id="percent">0%</div>
<div id="coins">0 🪙</div>
</div>

<div id="coin">🪙</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([54.35,18.64],16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OSM'
}).addTo(map);

const canvas = document.getElementById("fog");
const ctx = canvas.getContext("2d");

function resize(){
canvas.width = innerWidth;
canvas.height = innerHeight;
drawFog();
}
window.addEventListener("resize",resize);
resize();

/* MGŁA */
function drawFog(){
ctx.fillStyle="rgba(120,120,120,0.55)";
ctx.fillRect(0,0,canvas.width,canvas.height);
}

const discovered = JSON.parse(localStorage.getItem("fog")) || {};
let coins = Number(localStorage.getItem("coins")) || 0;

function save(){
localStorage.setItem("fog",JSON.stringify(discovered));
localStorage.setItem("coins",coins);
}

/* PROMIEŃ Z ZOOM */
function getRadius(){
return 0.0008 * Math.pow(2, map.getZoom()-15);
}

/* ODKRYWANIE */
function reveal(lat,lng){

const key = Math.floor(lat*2000)+"_"+Math.floor(lng*2000);

if(!discovered[key]){
discovered[key]=true;
coins++;

save();

document.getElementById("coins").innerText = coins+" 🪙";

const coin = document.getElementById("coin");
coin.classList.remove("coinShow");
void coin.offsetWidth;
coin.classList.add("coinShow");
}
}

/* UI */
function updateUI(){
const total = Object.keys(discovered).length;
document.getElementById("percent").innerText =
Math.min(100,(total/1500)*100).toFixed(1)+"%";
}

let player;

const icon = L.divIcon({
className:"",
html:`<div style="width:18px;height:18px;background:red;border-radius:50%;border:3px solid white;"></div>`
});

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

map.setView([lat,lng]);

if(!player){
player = L.marker([lat,lng],{icon}).addTo(map);
}else{
player.setLatLng([lat,lng]);
}

/* ODKRYCIE NA MAPIE (ŚCIEŻKA, NIE PIXELE) */
reveal(lat,lng);

updateUI();

});

drawFog();

</script>

</body>
</html>
