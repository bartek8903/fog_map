<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mario Fog Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:black;
}

#map{
    width:100vw;
    height:100vh;
}

/* HUD */

#hud{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:18px;
    background:rgba(0,0,0,0.75);
    padding:14px 24px;
    border-radius:20px;
    z-index:9999;
}

#marioBlock{
    width:72px;
    height:72px;
    background:#f7d51d;
    border:4px solid #b8860b;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:bold;
    color:white;
    image-rendering:pixelated;
    font-family:"Courier New", monospace;
    box-shadow:4px 4px 0 #8b5a00, 8px 8px 0 #5a3a00;
    animation:blockIdle 1s infinite alternate;
}

@keyframes blockIdle{
    from{transform:translateY(0px);}
    to{transform:translateY(-4px);}
}

#percent{
    color:white;
    font-size:36px;
    font-weight:bold;
    text-shadow:0 0 10px orange;
}

#coin{
    position:absolute;
    left:50%;
    bottom:120px;
    transform:translateX(-50%) scale(0);
    font-size:56px;
    z-index:99999;
}

.coinShow{
    animation:coinAnim 1s ease;
}

@keyframes coinAnim{
    0%{transform:translateX(-50%) translateY(0px) scale(0.3);opacity:0;}
    20%{opacity:1;transform:translateX(-50%) translateY(-40px) scale(1.2);}
    100%{opacity:0;transform:translateX(-50%) translateY(-150px) scale(0.7);}
}

.player{
    width:24px;
    height:24px;
    background:red;
    border-radius:50%;
    border:4px solid white;
    box-shadow:0 0 12px red,0 0 24px orange;
    animation:bounce 0.7s infinite alternate;
}

@keyframes bounce{
    from{transform:translateY(0px);}
    to{transform:translateY(-5px);}
}

#fogCanvas{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:500;
}

#achievement{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:black;
    color:yellow;
    padding:14px 24px;
    border:4px solid yellow;
    font-size:22px;
    font-weight:bold;
    z-index:999999;
    display:none;
}

</style>
</head>

<body>

<div id="map"></div>
<canvas id="fogCanvas"></canvas>

<div id="hud">
<div id="marioBlock">?</div>
<div id="percent">0%</div>
</div>

<div id="coin">🪙</div>
<div id="achievement">🏆 Achievement!</div>

<audio id="coinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-jump-223.wav"></audio>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([54.3520,18.6466],15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

const canvas = document.getElementById("fogCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
drawFog();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function drawFog(){
ctx.fillStyle = "rgba(0,0,0,0.94)";
ctx.fillRect(0,0,canvas.width,canvas.height);
}

function reveal(x,y){
ctx.save();
ctx.globalCompositeOperation="destination-out";
const g = ctx.createRadialGradient(x,y,20,x,y,120);
g.addColorStop(0,"rgba(0,0,0,1)");
g.addColorStop(1,"rgba(0,0,0,0)");
ctx.fillStyle=g;
ctx.beginPath();
ctx.arc(x,y,120,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

const percentText = document.getElementById("percent");
const coin = document.getElementById("coin");
const coinSound = document.getElementById("coinSound");
const achievement = document.getElementById("achievement");

let explored = 0;
let distance = 0;
let lastLat = null;
let lastLng = null;
let playerMarker = null;

function showAchievement(text){
achievement.innerText = text;
achievement.style.display="block";
setTimeout(()=>achievement.style.display="none",3000);
}

function checkAchievements(){
if(distance>=10){
showAchievement("🏆 Odkryto 10 KM!");
coinSound.play();
distance = -999999;
}
}

const playerIcon = L.divIcon({
className:"",
html:`<div class="player"></div>`,
iconSize:[24,24]
});

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

map.setView([lat,lng]);

if(playerMarker){
playerMarker.setLatLng([lat,lng]);
}else{
playerMarker = L.marker([lat,lng],{icon:playerIcon}).addTo(map);
}

const point = map.latLngToContainerPoint([lat,lng]);
reveal(point.x,point.y);

explored += 0.2;
if(explored>100) explored=100;

percentText.innerText = explored.toFixed(1)+"%";

coin.classList.remove("coinShow");
void coin.offsetWidth;
coin.classList.add("coinShow");

coinSound.currentTime=0;
coinSound.play();

if(lastLat!==null){
const R=6371;
const dLat=(lat-lastLat)*Math.PI/180;
const dLng=(lng-lastLng)*Math.PI/180;
const a=Math.sin(dLat/2)**2+
Math.cos(lastLat*Math.PI/180)*
Math.cos(lat*Math.PI/180)*
Math.sin(dLng/2)**2;
const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
distance+=R*c;
}

lastLat=lat;
lastLng=lng;

checkAchievements();

});

drawFog();

</script>

</body>
</html>
